Name: Macetohuerto
Summary: Urban plant care management app
Description: |
  Macetohuerto is a comprehensive Android app for managing and caring for your urban plants and small gardens.
  
  Features:
  - Plant management with detailed information
  - Advanced search and filtering system
  - Smart watering system with reminders
  - Photo gallery for each plant
  - Care history tracking
  - Home widget
  - Seasonal watering schedules
  - Fertilization and transplant tracking
  
  Perfect for urban gardeners who want to keep their plants healthy and thriving!

